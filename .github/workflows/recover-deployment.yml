name: Recover cancelled or failed workflow runs

on:
  workflow_run:
    workflows:
      - Deploy Our Universe to GitHub Pages
      - Validate Our Universe
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  recover-run:
    if: >-
      (github.event.workflow_run.conclusion == 'cancelled' ||
       github.event.workflow_run.conclusion == 'failure') &&
      github.event.workflow_run.run_attempt < 2
    runs-on: ubuntu-latest
    steps:
      - name: Retry eligible run safely
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            if (run.name === "Validate Our Universe") {
              core.info(`Retrying cancelled/failed validation run #${run.run_number} once.`);
              await github.rest.actions.reRunWorkflow({ owner, repo, run_id: run.id });
              core.info("GitHub accepted the validation rerun request.");
              return;
            }

            if (run.name !== "Deploy Our Universe to GitHub Pages") {
              core.info(`Ignoring unsupported workflow: ${run.name}`);
              return;
            }

            if (run.head_branch !== "main") {
              core.info(`Skipping deployment run #${run.run_number}: branch is not main.`);
              return;
            }

            const branch = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: "main",
            });
            const latestSha = branch.data.commit.sha;

            if (run.head_sha !== latestSha) {
              core.info(
                `Skipping stale deployment run #${run.run_number}: ${run.head_sha} is not latest main (${latestSha}). A newer commit superseded it; rerunning would risk deploying old code.`
              );
              return;
            }

            core.info(`Retrying latest-main deployment run #${run.run_number} once (${run.conclusion}).`);
            await github.rest.actions.reRunWorkflow({ owner, repo, run_id: run.id });
            core.info("GitHub accepted the deployment rerun request.");
